<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title | default("エージェント向けカタログ") }}{% endblock %}</title>
  <meta name="description" content="{{ description | default("AIエージェントが事業者を比較・提案するためのカタログ") }}">
  {% if markdown_url %}<link rel="alternate" type="text/markdown" href="{{ markdown_url }}">{% endif %}
  {% if jsonld %}
  <script type="application/ld+json">{{ jsonld | safe }}</script>
  {% endif %}
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; background: #f4f5f2; color: #1d221c; line-height: 1.7; }
    main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; background: #fff; }
    header.site { max-width: 46rem; margin: 0 auto; padding: 0.8rem 1.25rem 0; font-size: 0.85rem; }
    a { color: #1f5c3a; }
    h1 { font-size: 1.7rem; line-height: 1.35; margin-bottom: 0.4rem; }
    h2 { font-size: 1.15rem; margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; vertical-align: top; border-bottom: 1px solid #e4e6e1; padding: 0.4rem 0.5rem 0.4rem 0; }
    .meta { color: #4d564c; }
    .note { font-size: 0.85rem; color: #5c665b; }
  </style>
</head>
<body>
  <header class="site"><a href="/">エージェント向けカタログ</a> · <a href="/llms.txt">llms.txt</a> · <a href="/feed.json">feed</a></header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
